
<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>DISHUP! | Play · Discover · Order</title>

  <meta name="description"
    content="DISHUP! Food trivia game. Discover 100 dishes from around the world.">

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <link rel="stylesheet" href="./style.css?v=6">

  <style>
    .hidden {
      display: none !important;
    }

    #languagePanel {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    #languagePanel label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
    }

    #homeButton {
      background: #dcf5ff;
      border: 1px solid #8cc8e4;
      border-radius: 9px;
      padding: 6px 10px;
      font-size: 13px;
      color: #07577c;
      font-weight: 750;
      cursor: pointer;
    }

    #homeButton:hover {
      background: #82d7f5;
    }

    #worldMap {
      width: 100%;
      height: 390px;
      position: relative;
      z-index: 1;
    }

    .city-search {
      position: relative;
      width: 100%;
      max-width: 460px;
      margin-top: 8px;
    }

    #cityInput {
      width: 100%;
      box-sizing: border-box;
    }

    #citySuggestions {
      position: absolute;
      top: calc(100% + 5px);
      left: 0;
      right: 0;
      z-index: 2000;
      max-height: 260px;
      overflow-y: auto;
      background: #ffffff;
      border: 1px solid #a7d7ed;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 48, 79, 0.14);
    }

    .city-suggestion {
      display: block;
      width: 100%;
      padding: 12px 14px;
      background: #ffffff;
      color: #163f55;
      border: 0;
      border-bottom: 1px solid #e5f1f7;
      border-radius: 0;
      text-align: left;
      font: inherit;
      cursor: pointer;
    }

    .city-suggestion:last-child {
      border-bottom: 0;
    }

    .city-suggestion:hover,
    .city-suggestion.active {
      background: #e5f7ff;
    }

    .city-suggestion strong {
      display: block;
      font-size: 14px;
    }

    .city-suggestion small {
      display: block;
      margin-top: 3px;
      color: #607f91;
      font-size: 12px;
    }

    #citySearchStatus {
      margin: 6px 0;
      font-size: 12px;
      color: #607f91;
    }

    @media (max-width: 600px) {
      #homeButton {
        font-size: 11px;
        padding: 5px 7px;
      }

      #worldMap {
        height: 310px;
      }

      #citySuggestions {
        max-height: 220px;
      }
    }
  </style>
</head>

<body>

  <!-- LANGUAGE SELECTOR + HOME BUTTON -->

  <div id="languagePanel">
    <label>
      <span id="languageLabel">Lingua</span>

      <select
        id="languageSelect"
        onchange="setLanguage(this.value)"
        aria-label="Language"
      >
        <option value="it">🇮🇹 Italiano</option>
        <option value="en">🇬🇧 English</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="es">🇪🇸 Español</option>
        <option value="de">🇩🇪 Deutsch</option>
      </select>
    </label>

    <button
      id="homeButton"
      type="button"
      onclick="returnToMenu()"
    >
      🏠 Menu
    </button>
  </div>

  <!-- HEADER -->

  <header>
    <h1>
      DISHUP<span style="color:#129bd2">!</span>
    </h1>

    <b>PLAY · DISCOVER · ORDER</b>
  </header>

  <aside
    id="scoreBanner"
    class="hidden"
    aria-live="polite"
  ></aside>

  <!-- MAIN MENU -->

  <section class="panel" id="setup">
    <h2 id="setupTitle">Scegli come giocare</h2>

    <div class="grid">
      <button
        id="soloButton"
        onclick="setMode('solo')"
      >
        🎯 Single player
      </button>

      <button
        id="partyButton"
        onclick="setMode('party')"
      >
        🎉 Party (stesso schermo)
      </button>

      <button
        id="onlineButton"
        onclick="setMode('online')"
      >
        🌐 Online multiplayer
      </button>
    </div>

    <div id="partySetup" class="hidden">
      <p id="playersLabel">
        Giocatori (separati da virgole)
      </p>

      <input
        id="names"
        value="Alex, Sam"
        style="width:90%"
      >

      <button
        id="startButton"
        onclick="start()"
      >
        Inizia
      </button>
    </div>

    <p id="notice" class="muted"></p>
  </section>

  <!-- GAME -->

  <section id="game" class="panel hidden">

    <div id="status"></div>

    <p id="timer">⏱ 60 s</p>

    <div id="food"></div>

    <img
      id="dishPhoto"
      alt="Food photograph"
      referrerpolicy="no-referrer"
    >

    <p id="photoCredit" class="hidden"></p>

    <h2 id="dish"></h2>

    <p id="instructions" class="muted"></p>

    <!-- COUNTRY MAP -->

    <div id="mapAnswer">

      <strong id="mapLabel"></strong>

      <p
        id="selectedCountry"
        aria-live="polite"
      ></p>

      <div
        id="worldMap"
        role="application"
        aria-label="Interactive world map"
      ></div>

      <p id="mapHelp" class="muted"></p>

    </div>

    <!-- COUNTRY FALLBACK -->

    <label id="originFallback" class="hidden">
      <span id="fallbackLabel">Origine</span>
      <select id="origin"></select>
    </label>

    <!-- NUTRITION SLIDERS -->

    <div id="sliders"></div>

    <button
      id="submit"
      onclick="submitGuess()"
    ></button>

    <!-- PARTY MODE HANDOFF -->

    <div id="handoff" class="handoff hidden">

      <h3 id="handoffTitle"></h3>

      <p id="handoffText"></p>

      <button
        id="handoffButton"
        onclick="beginNextPlayer()"
      ></button>

    </div>

    <div id="results"></div>

    <button
      id="next"
      class="hidden"
      onclick="advance()"
    ></button>

  </section>

  <!-- FINAL SCREEN -->

  <section class="panel hidden" id="finish">

    <h2 id="finishTitle"></h2>

    <div id="leaderboard"></div>

    <!-- RESTAURANT DISCOVERY -->

    <div id="discover" class="discover">

      <h2 id="discoverTitle"></h2>

      <p id="discoverIntro"></p>

      <label for="cityInput">
        <span id="cityLabel"></span>
      </label>

      <!-- CITY AUTOCOMPLETE -->

      <div class="city-search" id="citySearch">

        <input
          id="cityInput"
          type="text"
          placeholder="Barcelona"
          autocomplete="off"
          autocapitalize="words"
          spellcheck="false"
          role="combobox"
          aria-autocomplete="list"
          aria-expanded="false"
          aria-controls="citySuggestions"
          aria-describedby="citySearchStatus"
        >

        <div
          id="citySuggestions"
          class="hidden"
          role="listbox"
          aria-label="City suggestions"
        ></div>

      </div>

      <p
        id="citySearchStatus"
        aria-live="polite"
      ></p>

      <div
        id="dishLinks"
        class="dish-links"
      ></div>

      <p id="discoverNote" class="muted"></p>

    </div>

    <button
      id="newGameButton"
      onclick="returnToMenu()"
    ></button>

  </section>

  <!-- LEAFLET -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>

  <!-- EXISTING GAME ENGINE -->

  <script src="./script.js?v=6"></script>

  <!-- CITY AUTOCOMPLETE ENGINE -->

  <script>
    (function () {
      "use strict";

      const input = document.getElementById("cityInput");
      const suggestions = document.getElementById("citySuggestions");
      const status = document.getElementById("citySearchStatus");

      if (!input || !suggestions || !status) return;

      let searchTimer = null;
      let controller = null;
      let searchVersion = 0;
      let results = [];
      let activeIndex = -1;
      let selectedCity = null;

      const cache = new Map();

      const messages = {
        it: {
          searching: "Ricerca città...",
          noResults: "Nessuna città trovata. Prova un altro nome.",
          error: "Ricerca non disponibile. Puoi comunque scrivere la città.",
          choose: "Seleziona una città dai suggerimenti.",
          selected: "Città selezionata"
        },

        en: {
          searching: "Searching for cities...",
          noResults: "No cities found. Try another name.",
          error: "Search unavailable. You can still type the city.",
          choose: "Choose a city from the suggestions.",
          selected: "Selected city"
        },

        fr: {
          searching: "Recherche de villes...",
          noResults: "Aucune ville trouvée. Essayez un autre nom.",
          error: "Recherche indisponible. Vous pouvez saisir la ville.",
          choose: "Choisissez une ville dans les suggestions.",
          selected: "Ville sélectionnée"
        },

        es: {
          searching: "Buscando ciudades...",
          noResults: "No se encontraron ciudades. Prueba otro nombre.",
          error: "Búsqueda no disponible. Puedes escribir la ciudad.",
          choose: "Selecciona una ciudad de las sugerencias.",
          selected: "Ciudad seleccionada"
        },

        de: {
          searching: "Städte werden gesucht...",
          noResults: "Keine Städte gefunden. Versuche einen anderen Namen.",
          error: "Suche nicht verfügbar. Du kannst die Stadt eingeben.",
          choose: "Wähle eine Stadt aus den Vorschlägen.",
          selected: "Ausgewählte Stadt"
        }
      };

      function currentLanguage() {
        const selector = document.getElementById("languageSelect");
        const value = selector ? selector.value : "en";
        return messages[value] ? value : "en";
      }

      function msg(key) {
        return messages[currentLanguage()][key];
      }

      function hideSuggestions() {
        suggestions.classList.add("hidden");
        suggestions.innerHTML = "";
        input.setAttribute("aria-expanded", "false");
        input.removeAttribute("aria-activedescendant");
        activeIndex = -1;
      }

      function cancelSearch() {
        clearTimeout(searchTimer);

        if (controller) {
          controller.abort();
          controller = null;
        }

        searchVersion++;
      }

      function formatCity(city) {
        return [
          city.name,
          city.admin1 && city.admin1 !== city.name
            ? city.admin1
            : null,
          city.country
        ].filter(Boolean).join(", ");
      }

      function chooseCity(city) {
        cancelSearch();

        selectedCity = city;

        // Keep the city and country in the Google Maps query.
        input.value = [city.name, city.country]
          .filter(Boolean)
          .join(", ");

        hideSuggestions();

        status.textContent =
          `${msg("selected")}: ${formatCity(city)}`;

        // Trigger the existing restaurant-link update.
        input.dispatchEvent(new Event("input", {
          bubbles: true
        }));
      }

      function updateActive() {
        const buttons = suggestions.querySelectorAll(
          ".city-suggestion"
        );

        buttons.forEach((button, index) => {
          const active = index === activeIndex;

          button.classList.toggle("active", active);
          button.setAttribute(
            "aria-selected",
            String(active)
          );

          if (active) {
            input.setAttribute(
              "aria-activedescendant",
              button.id
            );

            button.scrollIntoView({
              block: "nearest"
            });
          }
        });

        if (activeIndex < 0) {
          input.removeAttribute("aria-activedescendant");
        }
      }

      function displaySuggestions(cities) {
        results = cities;
        suggestions.innerHTML = "";
        activeIndex = -1;

        if (!cities.length) {
          hideSuggestions();
          status.textContent = msg("noResults");
          return;
        }

        cities.forEach((city, index) => {
          const button = document.createElement("button");

          button.type = "button";
          button.className = "city-suggestion";
          button.id = `city-option-${index}`;
          button.setAttribute("role", "option");
          button.setAttribute("aria-selected", "false");

          const name = document.createElement("strong");
          name.textContent = city.name;

          const detail = document.createElement("small");
          detail.textContent = [
            city.admin1 && city.admin1 !== city.name
              ? city.admin1
              : null,
            city.country
          ].filter(Boolean).join(", ");

          button.appendChild(name);
          button.appendChild(detail);

          // Prevent the input from losing focus before selection.
          button.addEventListener("pointerdown", event => {
            event.preventDefault();
          });

          button.addEventListener("click", () => {
            chooseCity(city);
          });

          suggestions.appendChild(button);
        });

        suggestions.classList.remove("hidden");
        input.setAttribute("aria-expanded", "true");

        status.textContent = msg("choose");
      }

      async function searchCities(query, version) {
        const lang = currentLanguage();

        const cacheKey =
          `${lang}:${query.toLocaleLowerCase()}`;

        if (cache.has(cacheKey)) {
          if (version === searchVersion) {
            displaySuggestions(cache.get(cacheKey));
          }
          return;
        }

        controller = new AbortController();

        status.textContent = msg("searching");

        try {
          const url = new URL(
            "https://geocoding-api.open-meteo.com/v1/search"
          );

          url.searchParams.set("name", query);
          url.searchParams.set("count", "8");
          url.searchParams.set("language", lang);
          url.searchParams.set("format", "json");

          const response = await fetch(url.toString(), {
            signal: controller.signal
          });

          if (!response.ok) {
            throw new Error("Geocoding request failed");
          }

          const data = await response.json();

          if (version !== searchVersion) return;

          const cities = (data.results || [])
            .filter(item =>
              item.name &&
              item.country &&
              Number.isFinite(item.latitude) &&
              Number.isFinite(item.longitude)
            );

          cache.set(cacheKey, cities);

          displaySuggestions(cities);

        } catch (error) {
          if (error.name === "AbortError") return;
          if (version !== searchVersion) return;

          hideSuggestions();
          status.textContent = msg("error");
        }
      }

      input.addEventListener("input", () => {
        cancelSearch();

        const query = input.value.trim();

        // If this input event came from choosing a suggestion,
        // do not start another search.
        if (
          selectedCity &&
          query === [selectedCity.name, selectedCity.country]
            .filter(Boolean)
            .join(", ")
        ) {
          hideSuggestions();
          return;
        }

        selectedCity = null;
        hideSuggestions();
        results = [];

        if (query.length < 2) {
          status.textContent = "";
          return;
        }

        const version = searchVersion;

        // Debounce: wait until the user pauses typing.
        searchTimer = setTimeout(() => {
          searchCities(query, version);
        }, 450);
      });

      input.addEventListener("keydown", event => {
        const isOpen =
          !suggestions.classList.contains("hidden");

        if (!isOpen || !results.length) return;

        if (event.key === "ArrowDown") {
          event.preventDefault();

          activeIndex =
            (activeIndex + 1) % results.length;

          updateActive();
        }

        if (event.key === "ArrowUp") {
          event.preventDefault();

          activeIndex =
            (activeIndex - 1 + results.length) %
            results.length;

          updateActive();
        }

        if (event.key === "Enter") {
          event.preventDefault();

          chooseCity(
            results[activeIndex >= 0 ? activeIndex : 0]
          );
        }

        if (event.key === "Escape") {
          hideSuggestions();
        }
      });

      document.addEventListener("click", event => {
        const searchBox =
          document.getElementById("citySearch");

        if (!searchBox.contains(event.target)) {
          hideSuggestions();
        }
      });

      input.addEventListener("focus", () => {
        if (
          results.length &&
          !selectedCity &&
          input.value.trim().length >= 2
        ) {
          displaySuggestions(results);
        }
      });

    })();
  </script>

</body>
</html>
