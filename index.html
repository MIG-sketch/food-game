
<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DISHUP! | Play · Discover · Order</title>
  <meta name="description" content="DISHUP! Food trivia game. Discover 100 dishes from around the world.">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="./style.css?v=6">

  <style>
    .hidden { display: none !important; }

    #languagePanel {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    #languagePanel label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
    }

    #homeButton {
      background: #dcf5ff;
      border: 1px solid #8cc8e4;
      border-radius: 9px;
      padding: 6px 10px;
      font-size: 13px;
      color: #07577c;
      font-weight: 750;
      cursor: pointer;
    }

    #homeButton:hover { background: #82d7f5; }

    #worldMap {
      width: 100%;
      height: 390px;
      position: relative;
      z-index: 1;
    }

    @media (max-width: 600px) {
      #homeButton {
        font-size: 11px;
        padding: 5px 7px;
      }

      #worldMap { height: 310px; }
    }
  </style>
</head>

<body>

  <div id="languagePanel">
    <label>
      <span id="languageLabel">Lingua</span>
      <select id="languageSelect" onchange="setLanguage(this.value)" aria-label="Language">
        <option value="it">🇮🇹 Italiano</option>
        <option value="en">🇬🇧 English</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="es">🇪🇸 Español</option>
        <option value="de">🇩🇪 Deutsch</option>
      </select>
    </label>

    <button id="homeButton" type="button" onclick="returnToMenu()">
      🏠 Menu
    </button>
  </div>

  <header>
    <h1>DISHUP<span style="color:#129bd2">!</span></h1>
    <b>PLAY · DISCOVER · ORDER</b>
  </header>

  <aside id="scoreBanner" class="hidden" aria-live="polite"></aside>

  <section class="panel" id="setup">
    <h2 id="setupTitle">Scegli come giocare</h2>

    <div class="grid">
      <button id="soloButton" onclick="setMode('solo')">🎯 Single player</button>
      <button id="partyButton" onclick="setMode('party')">🎉 Party (stesso schermo)</button>
      <button id="onlineButton" onclick="setMode('online')">🌐 Online multiplayer</button>
    </div>

    <div id="partySetup" class="hidden">
      <p id="playersLabel">Giocatori (separati da virgole)</p>
      <input id="names" value="Alex, Sam" style="width:90%">
      <button id="startButton" onclick="start()">Inizia</button>
    </div>

    <p id="notice" class="muted"></p>
  </section>

  <section id="game" class="panel hidden">
    <div id="status"></div>
    <p id="timer">⏱ 60 s</p>

    <div id="food"></div>

    <img id="dishPhoto"
      alt="Food photograph"
      referrerpolicy="no-referrer">

    <p id="photoCredit" class="hidden"></p>

    <h2 id="dish"></h2>

    <p id="instructions" class="muted"></p>

    <div id="mapAnswer">
      <strong id="mapLabel"></strong>
      <p id="selectedCountry" aria-live="polite"></p>

      <div id="worldMap"
        role="application"
        aria-label="Interactive world map"></div>

      <p id="mapHelp" class="muted"></p>
    </div>

    <label id="originFallback" class="hidden">
      <span id="fallbackLabel">Origine</span>
      <select id="origin"></select>
    </label>

    <div id="sliders"></div>

    <button id="submit" onclick="submitGuess()"></button>

    <div id="handoff" class="handoff hidden">
      <h3 id="handoffTitle"></h3>
      <p id="handoffText"></p>
      <button id="handoffButton" onclick="beginNextPlayer()"></button>
    </div>

    <div id="results"></div>
    <button id="next" class="hidden" onclick="advance()"></button>
  </section>

  <section class="panel hidden" id="finish">
    <h2 id="finishTitle"></h2>
    <div id="leaderboard"></div>

    <div id="discover" class="discover">
      <h2 id="discoverTitle"></h2>
      <p id="discoverIntro"></p>

      <label>
        <span id="cityLabel"></span>
        <input id="cityInput"
          placeholder="Barcelona"
          autocomplete="address-level2">
      </label>

      <div id="dishLinks" class="dish-links"></div>
      <p id="discoverNote" class="muted"></p>
    </div>

    <button id="newGameButton" onclick="returnToMenu()"></button>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./script.js?v=6"></script>

</body>
</html>
